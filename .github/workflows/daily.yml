name: daily pipeline

# Runs the same scripts a human runs locally -- no CI-only fork of the logic.
#
# This also dissolves the git-permission collision: the commit happens here with
# CI credentials, so the local rule (git push / gh api require a human) stays
# exactly as tight as it is.
#
# 09:15 UTC = ~05:15 ET, after the previous day's late West-coast matches have
# finished and been posted.

on:
  schedule:
    - cron: "15 9 * * *"
    # ⚠ A SECOND, MONDAY-ONLY RUN AT 20:15 UTC (= 4:15pm ET / 1:15pm PT).
    # The AVCA poll publishes on Mondays, usually early afternoon Eastern. The
    # 09:15 run happens BEFORE that, so a Monday poll would sit uncaptured
    # until Tuesday morning -- and the rankings endpoint is CURRENT-ONLY, so a
    # poll not captured on its publication day is not merely late, it can be
    # gone. This run also gives the weekly Digby freeze a second chance once
    # late Sunday finals have landed.
    - cron: "15 20 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to crawl (e.g. 2026)"
        required: false
        default: "2026"

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The nightly job does the whole-season pass, 46 guard suites and the
    # fresh-checkout rebuild, so it is allowed far longer than the refresh --
    # but not GitHub's six-hour default, which would hold the shared
    # concurrency group all morning if a fetch ever hangs.
    timeout-minutes: 90
    env:
      WVB_SEASON: ${{ github.event.inputs.season || '2026' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # match the local target; no version drift

      # Guard the invariants BEFORE touching the network. If the freshness
      # semantics ever regress, a daily run would silently re-freeze partial
      # days -- the exact bug this test was written for.
      # ⚠ CI INSTALLED NOTHING, AND THE SIMULATOR NEEDS NUMPY. Every daily run
      # since the simulator was written has skipped it with
      # "season sim needs predictions" -- a message about a missing input, when
      # the actual cause was ModuleNotFoundError. The projections it produces
      # are not committed, so nothing published was wrong; what was lost is that
      # the simulator has never once been exercised by the nightly run.
      - name: Install dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Freshness regression test
        run: python3 scripts/test_crawl_freshness.py

      - name: Record pre-run state
        id: pre
        run: |
          echo "games=$(wc -l < data/raw/$WVB_SEASON/games.jsonl 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      # Incremental by construction: crawl_2025.py refetches only dates that are
      # not yet authoritative (past AND all games final) and games not yet final.
      # Measured against 2025: a median in-season day is ~57 requests (~0.7 min),
      # p90 ~239 (~2.8 min), busiest ~435 (~5.2 min). A full recrawl is ~124 min.
      - name: Incremental crawl
        run: |
          python3 scripts/crawl_2025.py schedule
          python3 scripts/crawl_2025.py games
          python3 scripts/crawl_2025.py boxscores
          # WHERE each fixture is played. The scoreboard feed that enumerates
          # fixtures carries no location at all; only /game/{id} does, and it
          # answers for an UNPLAYED match. Bounded on purpose: a fixture with no
          # record is fetched once, and one inside the next 14 days is
          # refreshed, because that is when a placeholder start time is replaced
          # by a real one and a tournament's site firms up. Everything further
          # out is left alone, so this never becomes the whole-season refetch
          # that game_ids_from_schedule() warns about.
          python3 scripts/crawl_2025.py fixtures || echo "fixture venues unavailable; continuing"
          # Per-player lines, taken DAILY while the season runs. The 2024
          # backfill proved these are not reliably re-crawlable in bulk -- the
          # API started hanging after ~10k requests and left that season at 43%
          # -- so the live season's rows are collected as they happen and
          # committed. They cost a few kB a match and they are what availability
          # and next season's returning production are built from.
          python3 scripts/crawl_2025.py players
          python3 scripts/crawl_2025.py stats || echo "stats unavailable this early in the season; continuing"
          # Starting lineups from the play-by-play, taken daily for the same
          # reason as the player lines above: collected as they happen rather
          # than trusted to be re-crawlable later. Extracts six names a match
          # and DISCARDS the ~58 kB payload, so this adds kilobytes, not the
          # 296 MB a season of raw PBP would.
          #
          # As of 2026-08-22 the 2026 feed emits the `starters:` scaffold with
          # ZERO names filled, so this may legitimately collect nothing for a
          # while; `starters_lines_with_names` in the output is the counter that
          # says when that changes. Non-fatal either way.
          python3 scripts/crawl_pbp.py || echo "play-by-play unavailable; continuing"

      # A FAILED RUN MUST NOT OVERWRITE GOOD DATA WITH PARTIAL DATA.
      # The crawl is append-only and resumable, so a mid-crawl failure leaves a
      # known-partial log rather than a corrupted one. This gate stops a
      # partial/garbled crawl from reaching the published dashboard: the game
      # count must not go DOWN, which is the signature of a truncated fetch.
      - name: Sanity gate
        run: |
          post=$(wc -l < data/raw/$WVB_SEASON/games.jsonl 2>/dev/null || echo 0)
          pre=${{ steps.pre.outputs.games }}
          echo "games before=$pre after=$post"
          if [ "$post" -lt "$pre" ]; then
            echo "::error::game log SHRANK ($pre -> $post). Refusing to publish."
            exit 1
          fi

      - name: Rebuild derived outputs
        run: |
          # Classify each match's floor BEFORE anything rates it -- the rating
          # solves for a home-advantage term and must not credit one on a
          # neutral court. Cheap, and it self-populates as the season runs.
          # ⚠ THE BASE IS BUILT FIRST, AND THE ORDER IS THE WHOLE POINT.
          # predict_2026.py and simulate_season_2026.py both read
          # data/rating_2025.json. When this block sat further down, they ran
          # BEFORE it existed on a fresh checkout: the simulator exited 1 (and
          # its `||` hid that), while predict_2026 read `or {}` and quietly
          # produced predictions with no prior rating at all -- degraded output
          # that looked like success. Anything reading the completed season must
          # come after it is built.
          # ---- THE LAST COMPLETED SEASON: THE BASE EVERYTHING STANDS ON ----
          # These three scripts are season-parameterised and the job pins
          # WVB_SEASON=2026, so the lines above build only the LIVE season.
          # The 2025 artifacts are just as required and nothing was rebuilding
          # them:
          #   data_2025.json    test_projection re-derives ROTATION=6 from it
          #   rating_2025.json  build_rankings_board.build() hard-requires it
          #                     as the base; rating_2026.json is the optional
          #                     LIVE overlay and is correctly absent until 50
          #                     matches are played.
          # All three are gitignored build artifacts -- pure functions of the
          # committed raw -- so a fresh CI checkout has none of them. The daily
          # run was failing on exactly this: rating_2025.py refused to fit the
          # 4-match 2026 season (right), no rating_2025.json was ever built
          # (wrong), and build_hub.py died. It broke in f94be59, when
          # rating_2025.py was season-parameterised; the very next scheduled run
          # hit it. It stayed INVISIBLE only because build_hub was invoked as
          # `--public || echo ...` -- retiring the public build removed that
          # fallback, so the same fault now fails the step outright. Which is
          # the better behaviour, and is why this block exists.
          # Offline and ~seconds; ordered after the 2026 build so the live
          # season still wins where both exist.
          WVB_SEASON=2025 python3 scripts/build_dataset.py
          WVB_SEASON=2025 python3 scripts/rpi_2025.py
          WVB_SEASON=2025 python3 scripts/rating_2025.py

          python3 scripts/venues.py
          # Who did not take the floor. Cheap, and it needs the player lines
          # collected earlier in this same run.
          python3 scripts/availability.py
          # Win probability for everything still to be played. Depends on
          # venues.py above -- a neutral floor gets no home advantage.
          python3 scripts/predict_2026.py || echo "prediction needs a prior rating; skipping"
          # If this skips, say WHICH of the two reasons it was: an honest
          # message here would have surfaced the missing dependency a long time
          # ago instead of reading as an ordinary pre-season no-op.
          python3 scripts/simulate_season_2026.py \
            || echo "season sim did not run -- check for a missing dependency or an absent prior rating"
          # Score yesterday's predictions against what happened. Runs AFTER the
          # crawl so the results are in, and reads only the pre-match log.
          python3 scripts/score_predictions.py || true
          python3 scripts/build_dataset.py
          python3 scripts/rpi_2025.py || echo "RPI needs a game graph; skipping this early"
          python3 scripts/rating_2025.py

          # The PUBLIC dashboard is now the same builder as Cody's page, with
          # the third-party views stripped (VolleyTalk poll, Massey, TV
          # listings). One builder, two outputs -- the two pages used to be
          # different products, which is how the public one fell years behind.
          # build_vb.py is superseded and no longer run; kept on disk only as
          # the record of the old template.
          python3 scripts/project_lineups.py || echo "no lineups yet; continuing"
          # ⚠ THE FIXTURE TRUTH LEDGER RUNS FIRST, because the freeze reads
          # it. It classifies every non-final fixture as final /
          # scheduled_or_live / source_withdrawn / unknown from the SAVED
          # scoreboard observations, which are committed -- so the verdicts
          # are reproducible by anyone with the repo. It writes one derived
          # file and never touches a raw log.
          python3 scripts/fixture_disposition.py || echo "disposition unavailable; the freeze will simply block; continuing"
          # ⚠ THE WEEKLY FREEZE, AND WHY IT SITS HERE AND NOT EARLIER.
          # A Digby Weekly covers every match through the PRIOR SUNDAY in
          # Eastern, and it is written only when all of them are final. So it
          # must run after this job's own crawl steps above -- which it does --
          # and after the in-season refresh has had the overnight hours to
          # collect late Sunday finals. refresh.yml polls 22:00-11:00 UTC, so a
          # 9pm-Pacific Sunday match (04:00 UTC Monday) has been picked up
          # several times over before this 09:15 UTC step runs.
          # If anything through the cutoff is still live, unresolved or stale,
          # the script writes NOTHING and the calendar shows a waiting state
          # naming what it is waiting for. The Monday 20:15 UTC run above is
          # the second chance; a partial freeze is never the fallback.
          python3 scripts/snapshot_rankings.py || echo "snapshot skipped; continuing"
          python3 scripts/snapshot_conferences.py || echo "conference snapshot skipped; continuing"
          # The published polls. The rankings endpoint is CURRENT-ONLY and
          # cannot be season-pinned, so a poll not captured the day it is
          # published is gone for good. Appends only when the poll's own
          # "Through Games" stamp moves, so daily runs do not pile up rows.
          python3 scripts/crawl_polls.py || echo "polls unavailable; continuing"
          # A conference label can go stale mid-realignment (ncaa.com still
          # served UT Arlington as WAC after it joined the UAC). This reads the
          # team's own schedule and costs no network -- cheap insurance that a
          # one-team 'league' never collects an automatic bid.
          python3 scripts/conference_repair.py || echo "conference repair skipped"
          python3 scripts/digby_top25.py || echo "top 25 needs a projection; skipping"
          # RESUME -- what a team has EARNED, beside POWER. Writes its own
          # refusal (active:false) when too little of the season has been
          # played, so the page can state that rather than guess; it switches
          # itself on once the season is big enough.
          python3 scripts/resume_2025.py || echo "resume needs a rating or a blend; skipping"
          # NIGHTLY RESULT VERIFICATION (Cody, 2026-09-01, after the third
          # feed attribution inversion): every counted final checked against
          # BOTH schools' published schedules. It writes a report, an
          # append-only fetch log, the regenerable auto evidence projection,
          # and REVIEW candidates -- never a correction. Tolerated: an
          # unreachable school site must not block the pipeline.
          # ⚠ MUST RUN BEFORE confidence.py, which merges the auto evidence
          # and the day's verdicts into the payload the page embeds --
          # ordered the other way, the ledger lags a day.
          python3 scripts/verify_results_daily.py || echo "result verification skipped; continuing"
          # THE PERMUTATION DETECTOR (built 2026-09-01; found 13 real
          # inversions on its first run): H0/H1 forensic feature table over
          # every counted final. Offline, mutates nothing, writes its
          # artifact + review-queue candidates only.
          python3 scripts/attribution_suspicion.py || echo "attribution suspicion skipped; continuing"
          python3 scripts/confidence.py || echo "confidence ledger skipped"
          python3 scripts/availability_desk.py || echo "availability desk skipped"
          # bounded official-source collector: 12 schools max, rate-limited,
          # robots-respecting; daily cadence ONLY -- never the half-hourly job
          python3 scripts/collector.py || echo "collector skipped"
          python3 scripts/source_intel.py || echo "source intel skipped"
          # PLAYER RATINGS -- position boards, POWER and RESUME. Cheap and
          # offline: it reads the crawled box scores already on disk. It must
          # run BEFORE build_hub.py, which embeds its output; without it the
          # view renders a "not built yet" message rather than an empty table.
          # Passing, touches and rotation role come from the play-by-play, which
          # is a 775 MB file that is NOT committed -- so this is a no-op in CI
          # and the ratings simply ship without those fields rather than fail.
          python3 scripts/pbp_player_metrics.py || echo "no play-by-play on this machine; continuing"
          python3 scripts/player_rating.py || echo "player ratings skipped; continuing"
          # Parts-vs-whole and returning-by-position. Reads the ratings above
          # plus the completed prior season; no network, no big files.
          python3 scripts/team_parts.py || echo "team parts skipped; continuing"
          python3 scripts/build_hub.py   # Cody's page, everything on it
          # PUBLIC BUILD RE-ENABLED 2026-08-24 at Cody's request, so he can see
          # the hub from a phone. Same code, same page, minus every input that
          # is somebody else's: the VolleyTalk poll, Massey Ratings, the
          # transcribed TV listings and Digby. strip_private() removes them and
          # the build ABORTS if a marker survives; the VALUES are dropped where
          # they enter BOARD.build(), because hiding a column while shipping its
          # data in the payload is not the same as not publishing it.
          python3 scripts/build_hub.py --public

      # Semantic gate on what will actually be SERVED. The reconcile checks the
      # data; this checks that each number is under the right heading -- the
      # failure mode that shipped a "-14.31 points per set" to the live page
      # while every other check was green. Blocking: a mislabelled dashboard is
      # worse than a stale one, because it looks authoritative.
      # EVERY GUARD THAT CAN RUN HERE, RUNS HERE. Four suites were written and
      # then enforced only on my laptop, which makes them documentation rather
      # than guards -- the daily run would stay green while any of them broke.
      # test_projection needs data_2025.json, a derived artifact that is
      # deliberately not committed. It is BUILT above rather than skipped:
      # the comment here used to claim it skipped itself, but only check 2
      # skips -- check 1 hard-failed, and turned the daily run red for a
      # file CI was never given. A guard that cannot run in CI is
      # documentation; a guard that fails there for a missing input is
      # noise. Give it the input.
      - name: Invariant guards
        # ⚠ DISCOVERED, NOT LISTED. This step used to name every suite by hand
        # and the list drifted three times -- by 2026-08-27 it ran 32 of 46, so
        # fourteen guards protected nothing here. run_all_guards.py finds them,
        # runs them all even after one fails, and refuses to report a clean run
        # if discovery comes back near-empty. A new guard now runs the day it
        # is written. Kept to ONE command on purpose: the fresh-checkout guard
        # executes this workflow's commands line by line.
        run: |
          python3 scripts/run_all_guards.py

      # Coverage gate: a NEW displayed field with no declared provenance fails
      # the run. It cannot catch a client-side expression inventing a value for
      # a field that already has an entry -- that is what the sign/range
      # invariants above are for. Two independent checks, stated limits.
      - name: Provenance
        run: python3 scripts/provenance.py --check

      - name: Reconcile (report, do not block)
        run: python3 scripts/reconcile_2025.py || true

      # Only data/raw is committed. Derived outputs are gitignored and rebuilt
      # on read -- raw is the part that cannot be regenerated, and the rankings
      # endpoint cannot be season-pinned, so a season's official table is gone
      # once it rolls over.
      - name: Commit raw snapshot
        run: |
          git config user.name  "wvb-hub bot"
          git config user.email "noreply@github.com"
          # index.html carries the cache-busting hash of the dashboard. Without
          # it the CDN keeps serving the previous bytes for ~10 minutes, which
          # once made a deployed fix look broken on a phone check.
          # The weekly ranking archive lives in data/, not data/raw/, and is the
          # ONE artifact here that cannot be rebuilt: it records what the ranking
          # said before a week's results. Re-deriving it later from data that
          # includes those results would be a fit, not a ranking.
          # ⚠ THIS COMMENT USED TO SAY THE OPPOSITE OF THE LINE BELOW IT. It
          # read "output/vb_dashboard.html and index.html are no longer
          # regenerated (the public build is off), so they are not staged
          # either" -- left over from 2026-08-23, and still sitting directly
          # above a `git add` of both files, ninety lines under another comment
          # recording that the public build was RE-ENABLED on 2026-08-24. The
          # job was behaving correctly the whole time; the note beside it was
          # lying about what ran, which is the one thing a comment on a staging
          # step must not do.
          git add data/raw
          # The published page and its cache-busting redirect. index.html
          # carries a content hash: Fastly holds the object ~10 minutes, so
          # without a new URL a deployed fix keeps serving old bytes for long
          # enough that a phone check calls it broken.
          git add output/vb_dashboard.html index.html
          # SEPARATE, AND TOLERANT, ON PURPOSE. Under `bash -eo pipefail` an
          # unmatched glob is passed to git literally, git exits 128, and
          # `git add` aborts ATOMICALLY -- so data/raw and the dashboard would
          # not be staged either and the site would silently stop updating.
          # Verified in a scratch repo. The archive does not exist until the
          # first Monday of a season, so this WILL be unmatched each new year.
          git add data/rankings_history_*.jsonl 2>/dev/null || true
          # The derived fixture ledger. Committed because it is the AUDIT of
          # why a fixture stopped blocking a freeze -- a verdict nobody can
          # check is not evidence. Same tolerant form: it does not exist until
          # the first run of a season.
          git add data/fixture_disposition_*.json 2>/dev/null || true
          git add data/result_verification_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "daily: raw snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # NO deploy-pages STEP, deliberately. This repo's Pages is configured as
      # build_type "legacy" (branch main, path /), so a push to main already
      # triggers a Pages rebuild -- observed on commit 880ddff. actions/deploy-pages
      # requires build_type "workflow" and would have failed every night against
      # this configuration. Verified via `gh api repos/.../pages` before shipping.
      # If Pages is ever switched to workflow-based deployment, re-add:
      #   actions/configure-pages@v5, actions/upload-pages-artifact@v3, actions/deploy-pages@v4
      # and drop the `git push` above as the deploy trigger.
      - name: Confirm Pages picked up the commit
        if: success()
        run: |
          sleep 45
          gh api repos/${{ github.repository }}/pages/builds/latest --jq '{status,error:.error.message}' || true
        env:
          GH_TOKEN: ${{ github.token }}
