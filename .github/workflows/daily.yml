name: daily pipeline

# Runs the same scripts a human runs locally -- no CI-only fork of the logic.
#
# This also dissolves the git-permission collision: the commit happens here with
# CI credentials, so the local rule (git push / gh api require a human) stays
# exactly as tight as it is.
#
# 09:15 UTC = ~05:15 ET, after the previous day's late West-coast matches have
# finished and been posted.

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to crawl (e.g. 2026)"
        required: false
        default: "2026"

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      WVB_SEASON: ${{ github.event.inputs.season || '2026' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # match the local target; no version drift

      # Guard the invariants BEFORE touching the network. If the freshness
      # semantics ever regress, a daily run would silently re-freeze partial
      # days -- the exact bug this test was written for.
      - name: Freshness regression test
        run: python3 scripts/test_crawl_freshness.py

      - name: Record pre-run state
        id: pre
        run: |
          echo "games=$(wc -l < data/raw/$WVB_SEASON/games.jsonl 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      # Incremental by construction: crawl_2025.py refetches only dates that are
      # not yet authoritative (past AND all games final) and games not yet final.
      # Measured against 2025: a median in-season day is ~57 requests (~0.7 min),
      # p90 ~239 (~2.8 min), busiest ~435 (~5.2 min). A full recrawl is ~124 min.
      - name: Incremental crawl
        run: |
          python3 scripts/crawl_2025.py schedule
          python3 scripts/crawl_2025.py games
          python3 scripts/crawl_2025.py boxscores
          # Per-player lines, taken DAILY while the season runs. The 2024
          # backfill proved these are not reliably re-crawlable in bulk -- the
          # API started hanging after ~10k requests and left that season at 43%
          # -- so the live season's rows are collected as they happen and
          # committed. They cost a few kB a match and they are what availability
          # and next season's returning production are built from.
          python3 scripts/crawl_2025.py players
          python3 scripts/crawl_2025.py stats || echo "stats unavailable this early in the season; continuing"
          # Starting lineups from the play-by-play, taken daily for the same
          # reason as the player lines above: collected as they happen rather
          # than trusted to be re-crawlable later. Extracts six names a match
          # and DISCARDS the ~58 kB payload, so this adds kilobytes, not the
          # 296 MB a season of raw PBP would.
          #
          # As of 2026-08-22 the 2026 feed emits the `starters:` scaffold with
          # ZERO names filled, so this may legitimately collect nothing for a
          # while; `starters_lines_with_names` in the output is the counter that
          # says when that changes. Non-fatal either way.
          python3 scripts/crawl_pbp.py || echo "play-by-play unavailable; continuing"

      # A FAILED RUN MUST NOT OVERWRITE GOOD DATA WITH PARTIAL DATA.
      # The crawl is append-only and resumable, so a mid-crawl failure leaves a
      # known-partial log rather than a corrupted one. This gate stops a
      # partial/garbled crawl from reaching the published dashboard: the game
      # count must not go DOWN, which is the signature of a truncated fetch.
      - name: Sanity gate
        run: |
          post=$(wc -l < data/raw/$WVB_SEASON/games.jsonl 2>/dev/null || echo 0)
          pre=${{ steps.pre.outputs.games }}
          echo "games before=$pre after=$post"
          if [ "$post" -lt "$pre" ]; then
            echo "::error::game log SHRANK ($pre -> $post). Refusing to publish."
            exit 1
          fi

      - name: Rebuild derived outputs
        run: |
          # Classify each match's floor BEFORE anything rates it -- the rating
          # solves for a home-advantage term and must not credit one on a
          # neutral court. Cheap, and it self-populates as the season runs.
          python3 scripts/venues.py
          # Who did not take the floor. Cheap, and it needs the player lines
          # collected earlier in this same run.
          python3 scripts/availability.py
          # Win probability for everything still to be played. Depends on
          # venues.py above -- a neutral floor gets no home advantage.
          python3 scripts/predict_2026.py || echo "prediction needs a prior rating; skipping"
          python3 scripts/simulate_season_2026.py || echo "season sim needs predictions; skipping"
          # Score yesterday's predictions against what happened. Runs AFTER the
          # crawl so the results are in, and reads only the pre-match log.
          python3 scripts/score_predictions.py || true
          python3 scripts/build_dataset.py
          python3 scripts/rpi_2025.py || echo "RPI needs a game graph; skipping this early"
          python3 scripts/rating_2025.py
          # The PUBLIC dashboard is now the same builder as Cody's page, with
          # the third-party views stripped (VolleyTalk poll, Massey, TV
          # listings). One builder, two outputs -- the two pages used to be
          # different products, which is how the public one fell years behind.
          # build_vb.py is superseded and no longer run; kept on disk only as
          # the record of the old template.
          python3 scripts/project_lineups.py || echo "no lineups yet; continuing"
          # Freeze the ranking once a week, Monday, BEFORE any match starts.
          # This job runs 09:15 UTC = 05:15 ET, so a Monday capture is genuinely
          # pre-week. The script is a no-op on other days and re-running inside
          # the same ISO week changes nothing, so calling it daily is safe.
          python3 scripts/snapshot_rankings.py || echo "snapshot skipped; continuing"
          python3 scripts/build_hub.py --public || echo "public dashboard build failed; leaving the previous one in place"

      # Semantic gate on what will actually be SERVED. The reconcile checks the
      # data; this checks that each number is under the right heading -- the
      # failure mode that shipped a "-14.31 points per set" to the live page
      # while every other check was green. Blocking: a mislabelled dashboard is
      # worse than a stale one, because it looks authoritative.
      # EVERY GUARD THAT CAN RUN HERE, RUNS HERE. Four suites were written and
      # then enforced only on my laptop, which makes them documentation rather
      # than guards -- the daily run would stay green while any of them broke.
      # test_projection needs a derived artifact that is deliberately not
      # committed, so it skips itself on a fresh checkout and still enforces
      # locally.
      - name: Invariant guards
        run: |
          python3 scripts/test_display_invariants.py
          python3 scripts/test_roster_parser.py
          python3 scripts/test_venues.py
          python3 scripts/test_join_invariants.py
          python3 scripts/test_projection.py
          python3 scripts/test_score_predictions.py
          python3 scripts/test_lineups.py
          python3 scripts/test_rankings_history.py

      # Coverage gate: a NEW displayed field with no declared provenance fails
      # the run. It cannot catch a client-side expression inventing a value for
      # a field that already has an entry -- that is what the sign/range
      # invariants above are for. Two independent checks, stated limits.
      - name: Provenance
        run: python3 scripts/provenance.py --check

      - name: Reconcile (report, do not block)
        run: python3 scripts/reconcile_2025.py || true

      # Only data/raw is committed. Derived outputs are gitignored and rebuilt
      # on read -- raw is the part that cannot be regenerated, and the rankings
      # endpoint cannot be season-pinned, so a season's official table is gone
      # once it rolls over.
      - name: Commit raw snapshot
        run: |
          git config user.name  "wvb-hub bot"
          git config user.email "noreply@github.com"
          # index.html carries the cache-busting hash of the dashboard. Without
          # it the CDN keeps serving the previous bytes for ~10 minutes, which
          # once made a deployed fix look broken on a phone check.
          # The weekly ranking archive lives in data/, not data/raw/, and is the
          # ONE artifact here that cannot be rebuilt: it records what the ranking
          # said before a week's results. Re-deriving it later from data that
          # includes those results would be a fit, not a ranking.
          git add data/raw output/vb_dashboard.html index.html
          # SEPARATE, AND TOLERANT, ON PURPOSE. Under `bash -eo pipefail` an
          # unmatched glob is passed to git literally, git exits 128, and
          # `git add` aborts ATOMICALLY -- so data/raw and the dashboard would
          # not be staged either and the site would silently stop updating.
          # Verified in a scratch repo. The archive does not exist until the
          # first Monday of a season, so this WILL be unmatched each new year.
          git add data/rankings_history_*.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "daily: raw snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # NO deploy-pages STEP, deliberately. This repo's Pages is configured as
      # build_type "legacy" (branch main, path /), so a push to main already
      # triggers a Pages rebuild -- observed on commit 880ddff. actions/deploy-pages
      # requires build_type "workflow" and would have failed every night against
      # this configuration. Verified via `gh api repos/.../pages` before shipping.
      # If Pages is ever switched to workflow-based deployment, re-add:
      #   actions/configure-pages@v5, actions/upload-pages-artifact@v3, actions/deploy-pages@v4
      # and drop the `git push` above as the deploy trigger.
      - name: Confirm Pages picked up the commit
        if: success()
        run: |
          sleep 45
          gh api repos/${{ github.repository }}/pages/builds/latest --jq '{status,error:.error.message}' || true
        env:
          GH_TOKEN: ${{ github.token }}
